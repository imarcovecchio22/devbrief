name: Migraciones

# Aplica en Neon las migraciones nuevas de web/prisma apenas llegan a main,
# para que la base nunca quede atrás del código del pipeline y de la web.
on:
  push:
    branches: [main]
    paths:
      - "web/prisma/**"
  workflow_dispatch:

concurrency:
  group: migraciones
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run db:deploy
