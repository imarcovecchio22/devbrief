[project]
name = "diario"
version = "0.1.0"
description = "Pipeline del diario técnico personal: ingesta, dedupe, puntaje y redacción con LLM."
authors = [
    { name = "imarcovecchio22", email = "imarcovecchio22@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "selectolax>=1.0.0",
    "typer>=0.27.3",
]

[project.scripts]
diario = "diario.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: estilo, F: errores reales, I: orden de imports, B: bugs comunes,
# UP: sintaxis moderna, SIM: simplificaciones, RUF: reglas propias de Ruff
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# feedparser no publica tipos: sus valores se tratan como Any.
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
